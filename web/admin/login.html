<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>렌주 관리자 로그인</title><link rel="stylesheet" href="/renju/admin/login.css">
<script src="/renju/admin/login.js" defer></script></head>
<body><main class="login"><h1>렌주 관리자</h1><p>대국 기록 관리자 계정으로 로그인하세요.</p>
<form id="login"><label>아이디<input name="username" autocomplete="username" maxlength="256" required></label>
<label>비밀번호<input name="password" type="password" autocomplete="current-password" required></label>
<button type="submit">로그인</button><p id="message" role="status" aria-live="polite"></p></form></main></body></html>
