<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Renju MCTS Local Play</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f3f4f6; color: #111827; }
    header { padding: 18px 22px; background: #111827; color: white; }
    header h1 { margin: 0; font-size: 20px; }
    header p { margin: 5px 0 0; opacity: .75; font-size: 13px; }
    main { max-width: 1100px; margin: 20px auto; padding: 0 16px 32px; display: grid; grid-template-columns: minmax(0, 680px) 320px; gap: 18px; }
    .card { background: white; border: 1px solid #e5e7eb; border-radius: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.05); }
    .board-card { padding: 14px; }
    #board { width: 100%; aspect-ratio: 1; display: block; background: #d9a75d; border-radius: 8px; touch-action: manipulation; cursor: pointer; }
    .side { padding: 16px; display: flex; flex-direction: column; gap: 14px; align-self: start; }
    label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 6px; color: #4b5563; }
    select, input, button { width: 100%; border-radius: 8px; border: 1px solid #d1d5db; padding: 10px; font: inherit; }
    button { background: #111827; color: white; border: 0; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .status { padding: 12px; border-radius: 8px; background: #f9fafb; border: 1px solid #e5e7eb; line-height: 1.6; font-size: 14px; }
    .status strong { font-size: 16px; }
    #error { min-height: 20px; color: #b91c1c; font-size: 13px; }
    pre { margin: 0; padding: 12px; max-height: 320px; overflow: auto; white-space: pre-wrap; word-break: break-word; background: #0f172a; color: #dbeafe; border-radius: 8px; font-size: 11px; line-height: 1.45; }
    .legend { display: flex; gap: 14px; font-size: 12px; color: #6b7280; }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; border: 1px solid #374151; }
    .black { background: #111; } .white { background: #fff; }
    @media (max-width: 900px) { main { grid-template-columns: 1fr; } .side { width: 100%; } }
  </style>
</head>
<body>
<header>
  <h1>Renju MCTS Local Play</h1>
  <p>기존 Python Renju 엔진과 MCTS Agent를 그대로 사용하는 로컬 테스트 UI</p>
</header>

<main>
  <section class="card board-card">
    <canvas id="board" width="750" height="750" aria-label="15x15 Renju board"></canvas>
  </section>

  <aside class="card side">
    <div>
      <label for="agent">상대 MCTS 버전</label>
      <select id="agent">
        <option value="v321">MCTS V3.2.1</option>
        <option value="v41">MCTS V4.1</option>
        <option value="v42">MCTS V4.2</option>
        <option value="v5">MCTS V5 FINAL</option>
        <option value="v6" selected>MCTS V6</option>
      </select>
    </div>

    <div>
      <label>내 돌</label>
      <div class="row">
        <button class="color-btn" data-color="BLACK">흑 ●</button>
        <button class="color-btn" data-color="WHITE">백 ○</button>
      </div>
    </div>

    <div>
      <label for="seed">Seed</label>
      <input id="seed" type="number" value="42" min="0">
    </div>

    <button id="newGame">새 게임</button>
    <div id="error"></div>

    <div class="status">
      <strong id="result">준비 중...</strong><br>
      <span id="turn"></span><br>
      <span id="info"></span><br>
      <span id="logInfo"></span>
    </div>

    <div class="legend">
      <span><i class="dot black"></i>흑</span>
      <span><i class="dot white"></i>백</span>
      <span>빨간 점 = 마지막 착수</span>
    </div>

    <div>
      <label>최근 AI diagnostics</label>
      <pre id="diagnostics">{}</pre>
    </div>
  </aside>
</main>

<script>
const SIZE = 15;
const canvas = document.getElementById("board");
const ctx = canvas.getContext("2d");
const agentSelect = document.getElementById("agent");
const seedInput = document.getElementById("seed");
const newButton = document.getElementById("newGame");
const errorBox = document.getElementById("error");
const resultBox = document.getElementById("result");
const turnBox = document.getElementById("turn");
const infoBox = document.getElementById("info");
const logInfoBox = document.getElementById("logInfo");
const diagnosticsBox = document.getElementById("diagnostics");
let humanColor = "BLACK";
let state = null;
let busy = false;

document.querySelectorAll(".color-btn").forEach(button => {
  button.addEventListener("click", () => {
    humanColor = button.dataset.color;
    document.querySelectorAll(".color-btn").forEach(b => b.style.outline = "");
    button.style.outline = "3px solid #60a5fa";
  });
});
document.querySelector('[data-color="BLACK"]').style.outline = "3px solid #60a5fa";

async function request(path, body) {
  busy = true;
  updateControls();
  errorBox.textContent = "";
  try {
    const response = await fetch(path, {
      method: body ? "POST" : "GET",
      headers: body ? {"Content-Type": "application/json"} : {},
      body: body ? JSON.stringify(body) : undefined,
    });
    const payload = await response.json();
    if (!response.ok) throw new Error(payload.error || "요청 실패");
    state = payload;
    render();
    return payload;
  } catch (error) {
    errorBox.textContent = error.message;
  } finally {
    busy = false;
    updateControls();
  }
}

function updateControls() {
  newButton.disabled = busy;
  canvas.style.cursor = busy ? "wait" : "pointer";
}

function geometry() {
  const margin = canvas.width * 0.055;
  const span = canvas.width - margin * 2;
  return {margin, gap: span / (SIZE - 1)};
}

function drawBoard() {
  const {margin, gap} = geometry();
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "#d9a75d";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.strokeStyle = "#4b3219";
  ctx.lineWidth = 1.4;
  for (let i = 0; i < SIZE; i++) {
    const p = margin + i * gap;
    ctx.beginPath();
    ctx.moveTo(margin, p);
    ctx.lineTo(canvas.width - margin, p);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(p, margin);
    ctx.lineTo(p, canvas.height - margin);
    ctx.stroke();
  }

  const stars = [[3,3],[3,11],[7,7],[11,3],[11,11]];
  ctx.fillStyle = "#3b2714";
  for (const [r,c] of stars) {
    ctx.beginPath();
    ctx.arc(margin + c * gap, margin + r * gap, 4.5, 0, Math.PI * 2);
    ctx.fill();
  }

  if (!state) return;
  const radius = gap * 0.42;
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      const value = state.board[r][c];
      if (!value) continue;
      const x = margin + c * gap, y = margin + r * gap;
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      if (value === 1) {
        ctx.fillStyle = "#111827";
        ctx.fill();
      } else {
        ctx.fillStyle = "#f9fafb";
        ctx.fill();
        ctx.strokeStyle = "#4b5563";
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
    }
  }

  if (state.last_move) {
    const [r,c] = state.last_move;
    ctx.fillStyle = "#ef4444";
    ctx.beginPath();
    ctx.arc(margin + c * gap, margin + r * gap, Math.max(4, gap * .08), 0, Math.PI * 2);
    ctx.fill();
  }
}

function render() {
  drawBoard();
  if (!state) return;
  const human = state.human_color === "BLACK" ? "흑" : "백";
  const turn = state.to_play === "BLACK" ? "흑" : "백";
  if (state.done) {
    resultBox.textContent = state.winner
      ? (state.winner === state.human_color ? "승리!" : "패배")
      : "무승부";
    turnBox.textContent = "대국 종료";
  } else {
    resultBox.textContent = `${state.agent_name} 상대 / 나는 ${human}`;
    turnBox.textContent = `현재 차례: ${turn}`;
  }
  const aiTime = state.last_ai_seconds == null ? "-" : state.last_ai_seconds.toFixed(3) + "초";
  infoBox.textContent = `수: ${state.move_count} · AI 최근 계산: ${aiTime} · seed ${state.seed}`;
  logInfoBox.textContent = state.log_saved
    ? `로그 저장: ${state.log_directory}`
    : "로그: 경기 종료 시 자동 저장";
  diagnosticsBox.textContent = JSON.stringify(state.diagnostics || {}, null, 2);
}

canvas.addEventListener("click", async event => {
  if (busy || !state || state.done || state.to_play !== state.human_color) return;
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const x = (event.clientX - rect.left) * scaleX;
  const y = (event.clientY - rect.top) * scaleY;
  const {margin, gap} = geometry();
  const col = Math.round((x - margin) / gap);
  const row = Math.round((y - margin) / gap);
  if (row < 0 || row >= SIZE || col < 0 || col >= SIZE) return;
  await request("/api/move", {row, col});
});

newButton.addEventListener("click", () => request("/api/new", {
  agent: agentSelect.value,
  human_color: humanColor,
  seed: Number(seedInput.value || 42),
}));

window.addEventListener("resize", drawBoard);
request("/api/state");
</script>
</body>
</html>
