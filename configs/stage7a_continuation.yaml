# Stage 7-A continuation of the Stage 6 MVP run (gen 3 -> 30).
# Identical to configs/stage6_mvp.yaml except the execution-control keys
# training.generations / training.keep_checkpoints / output.run_name, which are
# NON_CRITICAL in training.config; the critical config hash must stay equal to the
# Stage 6 MVP hash so --resume accepts it (tests/test_stage7_foundation.py).
# Use it only with --resume on a COPY of the Stage 6 evidence run.
format_version: stage6-config-v1
seed: 42
device: cpu
torch_threads: 1

model:            # Stage 4 default architecture
  channels: 64
  blocks: 4
  policy_channels: 2
  value_channels: 1
  value_hidden: 64

training:
  generations: 30
  games_per_generation: 4
  batch_size: 32
  steps_per_generation: 50
  replay_capacity: 10000
  init_checkpoint: null
  keep_checkpoints: 32   # keep every gen 3..30 checkpoint for probes/eval
  grad_clip: null

self_play:        # Stage 5 defaults except simulations
  simulations: 25
  c_puct: 1.5
  tau: 1.0
  temperature_moves: 10
  dirichlet_alpha: 0.05
  dirichlet_epsilon: 0.25
  max_moves: 225  # board limit only; Stage 5 self-play has no truncation

augmentation:
  enabled: true

optimizer:        # Stage 4 tiny-overfit optimizer (Adam, lr 1e-3)
  name: adam
  lr: 0.001
  weight_decay: 0.0001
  momentum: 0.0

loss:
  value_weight: 1.0
  l2_coeff: 0.0

evaluation:
  every: 1
  puct_simulations: 25
  c_puct: 1.5
  opening_random_plies: 2
  opening_radius: 2
  random:   {black_games: 2, white_games: 2}
  tactical: {black_games: 2, white_games: 2}
  previous: {black_games: 2, white_games: 2}
  mcts_v6:
    final_generation_only: true
    black_games: 1
    white_games: 1
    use_frozen_config: true

output:
  runs_dir: runs
  run_name: stage7a_continuation
