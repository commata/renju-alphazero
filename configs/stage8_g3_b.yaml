# Stage 8 Gate 3 colour-balance A/B, arm B - colour-balanced sampling: half of every batch from black-won games, half from white-won games.
# NEW run from the exported stage8_d16 gen 200 weights (the only checkpoint whose value head
# was colour-neutral: color_bias -0.03). Arms C / B / W differ in ONE training-critical key
# (tests/test_stage8_gate3.py); seeds are identical, so self-play starts from the same games.
# Run the three arms in parallel with scripts/run_stage8_training.py --new-run --anchor 0.
format_version: stage6-config-v1
seed: 42
device: cpu
torch_threads: 1

model:            # Stage 4 default architecture
  channels: 64
  blocks: 4
  policy_channels: 2
  value_channels: 1
  value_hidden: 64

training:
  generations: 480        # ~8 h with three arms in parallel (7,680 games per arm)
  games_per_generation: 16
  batch_size: 32
  steps_per_generation: 50
  replay_capacity: 10000
  init_checkpoint: runs/stage8_init/stage8_d16_gen200_weights.pt
  keep_checkpoints: 3
  keep_every: 20
  grad_clip: null
  balanced_sampling: true   # the ONLY training-critical change vs arm C

self_play:        # Stage 5 defaults except simulations
  simulations: 50                   # Stage 7-A: 25
  tactical_rules: true
  c_puct: 1.5
  tau: 1.0
  temperature_moves: 10
  dirichlet_alpha: 0.05
  dirichlet_epsilon: 0.25
  max_moves: 225  # board limit only; Stage 5 self-play has no truncation

augmentation:
  enabled: true

optimizer:        # Stage 4 tiny-overfit optimizer (Adam, lr 1e-3)
  name: adam
  lr: 0.001
  weight_decay: 0.0001
  momentum: 0.0

loss:
  value_weight: 1.0
  l2_coeff: 0.0

evaluation:
  every: 1
  puct_simulations: 25
  c_puct: 1.5
  tactical_rules: true
  opening_random_plies: 2
  opening_radius: 2
  random:   {black_games: 2, white_games: 2}
  tactical: {black_games: 2, white_games: 2}
  previous: {black_games: 2, white_games: 2}
  mcts_v6:
    final_generation_only: true
    black_games: 1
    white_games: 1
    use_frozen_config: true

output:
  runs_dir: runs
  run_name: stage8_g3_b

milestones:       # execution-only (not in the critical hash)
  enabled: false
  window: 5
  threshold: 0.25
  opponents: [random, tactical, previous]
  first_win: [tactical, mcts_v6]

flush_denormal: true   # execution-only; Gate 2 found subnormals made training ~3x slower

health:           # execution-only (not in the critical hash), Stage 8
  color_imbalance:
    enabled: true
    window: 10
    lower: 0.10
    upper: 0.90
