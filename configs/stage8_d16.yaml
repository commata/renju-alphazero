# Stage 8 continuation of the Stage 7-D D16 run (docs/stage8-plan.md).
# Resume a COPY of runs/stage7d_b16 (runs/stage8_d16) from checkpoint_gen160.pt;
# the Stage 7 run is evidence and is not modified. Training-critical settings are
# identical to configs/stage7d_b16.yaml (critical hash 25ab9c5a..., pinned by
# tests/test_stage8_health.py). Only execution-control keys differ:
# generations (gate target: 200 = +640 games; raise to 320 / 480 for gates 2 / 3,
# aligned with the 320-game external evaluation points of run_stage8_training.py),
# run_name, and the execution-only health block.
format_version: stage6-config-v1
seed: 42
device: cpu
torch_threads: 1

model:            # Stage 4 default architecture
  channels: 64
  blocks: 4
  policy_channels: 2
  value_channels: 1
  value_hidden: 64

training:
  generations: 200        # Stage 8 gate 1 (+640 games from gen 160, an eval point)
  games_per_generation: 16
  batch_size: 32
  steps_per_generation: 50
  replay_capacity: 10000
  init_checkpoint: runs/stage7d_init/stage7c_b_gen110_weights.pt
  keep_checkpoints: 5
  keep_every: 20
  grad_clip: null

self_play:        # Stage 5 defaults except simulations
  simulations: 50                   # Stage 7-A: 25
  tactical_rules: true
  c_puct: 1.5
  tau: 1.0
  temperature_moves: 10
  dirichlet_alpha: 0.05
  dirichlet_epsilon: 0.25
  max_moves: 225  # board limit only; Stage 5 self-play has no truncation

augmentation:
  enabled: true

optimizer:        # Stage 4 tiny-overfit optimizer (Adam, lr 1e-3)
  name: adam
  lr: 0.001
  weight_decay: 0.0001
  momentum: 0.0

loss:
  value_weight: 1.0
  l2_coeff: 0.0

evaluation:
  every: 1
  puct_simulations: 25
  c_puct: 1.5
  tactical_rules: true
  opening_random_plies: 2
  opening_radius: 2
  random:   {black_games: 2, white_games: 2}
  tactical: {black_games: 2, white_games: 2}
  previous: {black_games: 2, white_games: 2}
  mcts_v6:
    final_generation_only: true
    black_games: 1
    white_games: 1
    use_frozen_config: true

output:
  runs_dir: runs
  run_name: stage8_d16

milestones:       # execution-only (not in the critical hash)
  enabled: true
  window: 5
  threshold: 0.25
  opponents: [random, tactical, previous]
  first_win: [tactical, mcts_v6]

flush_denormal: true   # execution-only; Gate 2 found subnormals made training ~3x slower

health:           # execution-only (not in the critical hash), Stage 8
  color_imbalance:
    enabled: true
    window: 10
    lower: 0.10
    upper: 0.90
