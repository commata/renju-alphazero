# H3 CPU smoke / throughput run (no result is used): a few hundred steps, partial validation.
cache_dir: data/external/renjunet/h3_cache
out_dir: runs/h3_smoke_cpu
device: cpu
torch_threads: 4  # desktop i5-12600K: 4 threads 612 samples/s vs default (16) ~200 (§12.11)
seed: 20261003
channels: 64
blocks: 4
batch_size: 256
epochs: 1
max_steps: 300
learning_rate: 0.002
weight_decay: 0.0001
warmup_steps: 50
min_lr_ratio: 0.02
augment_d4: true
amp_bf16: false
eval_every: 300
eval_max_states: 20000
checkpoint_every: 100
log_every: 25
