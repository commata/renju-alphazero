# Stage 7-D sample-reuse experiment, arm D32.
# NEW run initialized from the exported Stage 7-C B gen 110 weights
# (scripts/export_stage7_weights.py runs/stage7c_b_rules/checkpoints/checkpoint_gen110.pt).
# D16 and D32 differ ONLY in training.games_per_generation (critical) and the
# execution-control keys generations / keep_every / run_name
# (tests/test_stage7d_reuse.py). Both reach 2,560 self-play games; checkpoints
# are kept every 320 games so the arms can be compared at equal game counts.
format_version: stage6-config-v1
seed: 42
device: cpu
torch_threads: 1

model:            # Stage 4 default architecture
  channels: 64
  blocks: 4
  policy_channels: 2
  value_channels: 1
  value_hidden: 64

training:
  generations: 80
  games_per_generation: 32
  batch_size: 32
  steps_per_generation: 50
  replay_capacity: 10000
  init_checkpoint: runs/stage7d_init/stage7c_b_gen110_weights.pt
  keep_checkpoints: 5
  keep_every: 10
  grad_clip: null

self_play:        # Stage 5 defaults except simulations
  simulations: 50                   # Stage 7-A: 25
  tactical_rules: true
  c_puct: 1.5
  tau: 1.0
  temperature_moves: 10
  dirichlet_alpha: 0.05
  dirichlet_epsilon: 0.25
  max_moves: 225  # board limit only; Stage 5 self-play has no truncation

augmentation:
  enabled: true

optimizer:        # Stage 4 tiny-overfit optimizer (Adam, lr 1e-3)
  name: adam
  lr: 0.001
  weight_decay: 0.0001
  momentum: 0.0

loss:
  value_weight: 1.0
  l2_coeff: 0.0

evaluation:
  every: 1
  puct_simulations: 25
  c_puct: 1.5
  tactical_rules: true
  opening_random_plies: 2
  opening_radius: 2
  random:   {black_games: 2, white_games: 2}
  tactical: {black_games: 2, white_games: 2}
  previous: {black_games: 2, white_games: 2}
  mcts_v6:
    final_generation_only: true
    black_games: 1
    white_games: 1
    use_frozen_config: true

output:
  runs_dir: runs
  run_name: stage7d_b32

milestones:       # execution-only (not in the critical hash)
  enabled: true
  window: 5
  threshold: 0.25
  opponents: [random, tactical, previous]
  first_win: [tactical, mcts_v6]
